[workspace]
members = [
    "librandomart",
    "cpu",
    "math",
    "math-conformance",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
randomart = { path = "librandomart" }
cpu = { path = "cpu" }
anyhow = "1.0.104"
divan = "0.1.21"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }

[profile.release]
lto = true
