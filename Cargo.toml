[workspace]
members = [
    "engine",
    "closure-tree",
    "cli",
    "stack-vm",
    "conformance",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
engine = { path = "engine" }
anyhow = "1.0.104"
divan = "0.1.21"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
