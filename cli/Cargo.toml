[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "randomart"
path = "src/main.rs"

[features]
# Exactly one backend is selected at build time. closure-tree is the default;
# swap it with e.g. `--no-default-features --features cranelift`.
# metal is macOS-only (its deps don't build elsewhere).
default = ["closure"]
closure = ["dep:closure-tree"]
cranelift = ["dep:cranelift-backend"]
metal = ["dep:metal"]

[dependencies]
engine = { path = "../engine" }
clap = { version = "4.6.7", features = ["derive"] }
image = "0.25.10"

closure-tree = { path = "../closure-tree", optional = true }
cranelift-backend = { path = "../cranelift-backend", optional = true }
metal = { path = "../metal", optional = true }
anyhow = "1.0.104"
