[package]
name = "cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "randomart"
path = "src/main.rs"

[features]
# Features choose which backends are compiled in; `--backend` picks one at run
# time. closure-tree is the default.
default = ["closure"]
closure = ["dep:closure-tree"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }

closure-tree = { path = "../closure-tree", optional = true }
serde_json = "1.0.151"
engine.workspace = true
anyhow.workspace = true
